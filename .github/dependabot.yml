version: 2

updates:
  # The API, admin console and tooling. Security fixes arrive as separate pull requests on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The Expo SDK fixes one compatible version of each of these. Move them together with
      # `npx expo install --fix` when you upgrade the SDK (docs/MOBILE-RELEASE.md), not one at a time.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "babel-preset-expo"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
