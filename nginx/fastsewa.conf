# ─────────────────────────────────────────────────────────────────────────────
# FastSewa API behind nginx: TLS, a flood guard, streamed uploads, JSON errors.
#
#   sudo cp nginx/fastsewa.conf /etc/nginx/conf.d/fastsewa.conf
#   sudo sed -i 's/api\.example\.com/<your host name>/g' /etc/nginx/conf.d/fastsewa.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates (Let's Encrypt, first time): comment out the whole "server { listen 443 … }" block,
# reload, run  certbot certonly --webroot -w /var/www/certbot -d <your host name>,  put the block
# back and reload. DEPLOYMENT.md has the full sequence.
#
# This file is included inside nginx's http { } block (conf.d/*.conf and sites-enabled/* both are),
# so the zones, the log format and the upstream below are http-level and may not be repeated.
#
# What it assumes
#   * The API listens on 127.0.0.1:5000 (docker-compose.yml publishes it on the loopback address
#     only). Set TRUST_PROXY=1 for the API (the default in production): nginx is the one proxy
#     in front of it, and X-Forwarded-For is overwritten here so clients cannot forge it.
#   * A CDN or another proxy in front of nginx: add set_real_ip_from <its ranges>; and
#     real_ip_header X-Forwarded-For; in the http block, so $remote_addr is the real client.
#   * The API sends HSTS, CSP, nosniff and cache headers itself; they are not repeated here
#     (duplicated security headers are a common source of confusion).
#   * The API compresses its own JSON; nginx does not compress again.
# ─────────────────────────────────────────────────────────────────────────────

upstream fastsewa_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# One line per request. $uri has no query string on purpose: signed certificate links carry their
# signature there. IP addresses are personal data: keep these logs only as long as your retention
# policy says (docs/DPDP-CHECKLIST.md), and rotate them (logrotate does this by default).
# $request_id is also sent to the API (X-Request-Id), so a line here matches the API's log line.
log_format fastsewa '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_response_time rid=$request_id';

# The API limits per user, per username and per address where that makes sense (server/middleware/
# rateLimit.ts) because a whole crew often shares one site Wi-Fi address. These two zones are only a
# coarse guard against a single address flooding the machine, so they are deliberately generous:
# 150 requests a second is far beyond a classroom of people and tiny for a script.
limit_req_zone $binary_remote_addr zone=fastsewa_flood:10m rate=150r/s;
# Credential endpoints only (login, register, password reset). A crew signing in together at the
# start of a shift fits in the burst; a password-guessing script does not.
limit_req_zone $binary_remote_addr zone=fastsewa_auth:10m rate=10r/s;

# ── HTTP: answer certbot, send everything else to HTTPS ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.example.com$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    # nginx 1.25.1 and newer: write  listen 443 ssl;  and add  http2 on;  (this form still works there,
    # with a warning). Ubuntu 22.04/24.04 and Debian 12 ship older versions, so the form below is used.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # Mozilla "intermediate": modern clients pick the cipher
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:fastsewa_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP address, so nginx would only warn.

    access_log /var/log/nginx/fastsewa.access.log fastsewa;
    error_log  /var/log/nginx/fastsewa.error.log warn;

    # JSON bodies are at most 1 MB (the admin console's lesson editor); only the upload location below accepts more.
    client_max_body_size  1m;
    client_header_timeout 30s;
    client_body_timeout   30s;
    send_timeout          60s;

    limit_req_status 429;
    limit_req zone=fastsewa_flood burst=300 nodelay;

    # Proxy settings live here once; locations inherit them (they must not add their own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection        "";                  # lets nginx reuse connections to the API
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;        # a single hop, exactly what TRUST_PROXY=1 reads
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_next_upstream   off;                              # never replay a request on a second try

    # nginx's own failures answer in the API's JSON shape, so the app shows its translated message
    # instead of an HTML page. (Errors the API itself returns pass through untouched.)
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    # ── operational ──────────────────────────────────────────────────────────
    # Liveness: for uptime monitors. No rate limit, no log line per probe.
    location = /api/health {
        access_log off;
        limit_req zone=fastsewa_flood burst=300 nodelay;
        proxy_pass http://fastsewa_api;
    }

    # Readiness shows database latency and pool numbers: this machine only (load balancer checks on
    # the host, `curl http://127.0.0.1:5000/api/health/ready` against the container directly).
    location = /api/health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        access_log off;
        proxy_pass http://fastsewa_api;
    }

    # ── credentials: login, registration, password reset ─────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=fastsewa_auth  burst=40  nodelay;
        limit_req zone=fastsewa_flood burst=300 nodelay;
        proxy_pass http://fastsewa_api;
    }

    # ── uploads to the local media store (MEDIA_PROVIDER=local) ──────────────
    # Streamed straight to the API instead of being buffered on nginx's disk first. Keep
    # client_max_body_size a little above MAX_VIDEO_MB (default 500) from the API's settings.
    location ~ ^/api/v1/admin/media/upload/[^/]+$ {
        client_max_body_size 520m;
        client_body_timeout  600s;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://fastsewa_api;
    }

    # ── everything else: API, admin console (/admin), certificate pages (/verify), media (/uploads) ──
    location / {
        proxy_pass http://fastsewa_api;
    }

    # Dotfiles are never served by the API; refuse them here too (certbot's /.well-known is on port 80 only).
    location ~ /\.(?!well-known) {
        return 404;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":"The request is too large","code":"PAYLOAD_TOO_LARGE","requestId":"$request_id"}';
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"Too many requests, please try again later","code":"RATE_LIMITED","requestId":"$request_id"}';
    }

    location @unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Service temporarily unavailable","code":"SERVICE_UNAVAILABLE","requestId":"$request_id"}';
    }
}
